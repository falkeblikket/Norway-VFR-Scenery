[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "norway-vfr-scenery"
version = "0.1.0"
description = "A careful, local-first scenery manager for Microsoft Flight Simulator"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "pyinstaller>=6.11,<7"]

[project.gui-scripts]
norway-vfr = "nvfr.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nvfr = ["data/*.json", "data/catalogues/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["windows: real Windows filesystem integration", "gui: requires a graphical display"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
